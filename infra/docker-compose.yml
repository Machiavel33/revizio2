name: revizio

services:
  postgres:
    image: postgres:16-alpine
    container_name: revizio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revizio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revizio_dev}
      POSTGRES_DB: ${POSTGRES_DB:-revizio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revizio} -d ${POSTGRES_DB:-revizio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: revizio-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: revizio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-revizio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-revizio_dev_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: revizio-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-revizio} ${MINIO_ROOT_PASSWORD:-revizio_dev_secret} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-revizio-audio} &&
      echo 'MinIO bucket ready';
      "

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: revizio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requis}
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:?BYOK_ENCRYPTION_KEY requis}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-revizio}:${POSTGRES_PASSWORD:-revizio_dev}@postgres:5432/${POSTGRES_DB:-revizio}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-revizio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-revizio_dev_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-revizio-audio}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "${API_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: revizio-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requis}
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:?BYOK_ENCRYPTION_KEY requis}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-revizio}:${POSTGRES_PASSWORD:-revizio_dev}@postgres:5432/${POSTGRES_DB:-revizio}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-revizio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-revizio_dev_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-revizio-audio}
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: revizio-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  redisdata:
  miniodata:
