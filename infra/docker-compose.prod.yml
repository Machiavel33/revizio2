# Revizio — stack de production complète (mono-serveur, stockage local).
# Autonome : ne dépend pas de docker-compose.yml (pas de MinIO).
# Usage: docker compose -f docker-compose.prod.yml up -d --build
name: revizio

services:
  postgres:
    image: postgres:16-alpine
    container_name: revizio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revizio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-revizio}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revizio} -d ${POSTGRES_DB:-revizio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: revizio-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: revizio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      stt:
        condition: service_started
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requis}
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:?BYOK_ENCRYPTION_KEY requis}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-revizio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-revizio}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /data/audio
      DOWNLOADS_DIR: /data/downloads
      TRANSCRIBE_ENGINE: ${TRANSCRIBE_ENGINE:-local}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      WHISPER_MAX_CONCURRENCY: ${WHISPER_MAX_CONCURRENCY:-2}
      # Service STT découplé (vide = transcription locale legacy)
      STT_SERVICE_URL: ${STT_SERVICE_URL:-http://stt:8100}
      STT_SHARED_SECRET: ${STT_SHARED_SECRET:-}
      HF_HOME: /data/whisper
      CORS_ORIGINS: ${CORS_ORIGINS:-https://revizio.darkops.fr}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - audio_data:/data/audio
      - whisper_cache:/data/whisper
      - ../downloads:/data/downloads:ro
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"

  worker:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: revizio-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      stt:
        condition: service_started
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requis}
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:?BYOK_ENCRYPTION_KEY requis}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-revizio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-revizio}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /data/audio
      TRANSCRIBE_ENGINE: ${TRANSCRIBE_ENGINE:-local}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      WHISPER_MAX_CONCURRENCY: ${WHISPER_MAX_CONCURRENCY:-2}
      STT_SERVICE_URL: ${STT_SERVICE_URL:-http://stt:8100}
      STT_SHARED_SECRET: ${STT_SHARED_SECRET:-}
      HF_HOME: /data/whisper
    volumes:
      - audio_data:/data/audio
      - whisper_cache:/data/whisper
    # Le worker n'expose aucun serveur HTTP : on remplace le HEALTHCHECK hérité
    # de l'image (curl sur :8000) par un ping Celery réel sur le broker.
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=1

  # Service STT découplé : faster-whisper batch + sherpa-onnx streaming.
  # Isolé de l'API pour que la transcription ne bloque jamais les requêtes HTTP/WS.
  # Service STT découplé : faster-whisper batch + sherpa-onnx streaming.
  # Isolé de l'API pour que la transcription ne bloque jamais les requêtes HTTP/WS.
  # Scalabilité horizontale : `docker compose up -d --scale stt=N` (pas de
  # container_name fixe ; l'API joint `http://stt:8100` et Docker répartit via DNS).
  stt:
    build:
      context: ../services/stt
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "false"
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      WHISPER_MAX_CONCURRENCY: ${WHISPER_MAX_CONCURRENCY:-2}
      WHISPER_POOL_SIZE: ${WHISPER_POOL_SIZE:-1}
      SHERPA_ENABLED: ${SHERPA_ENABLED:-true}
      SHERPA_MODEL_DIR: /data/models/sherpa-onnx-streaming-zipformer-fr-2023-04-14
      STT_SHARED_SECRET: ${STT_SHARED_SECRET:-}
      HF_HOME: /data/whisper
    volumes:
      - whisper_cache:/data/whisper
      - stt_models:/data/models
    # Pas de port publié : accessible uniquement sur le réseau interne (api/worker).
    expose:
      - "8100"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8100/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: revizio-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  redisdata:
  audio_data:
  whisper_cache:
  stt_models:
