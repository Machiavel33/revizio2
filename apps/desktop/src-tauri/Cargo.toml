[package]
name = "revizio-desktop"
version = "0.1.0"
description = "Revizio — enregistrement de cours et fiches de révision"
authors = ["Revizio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "revizio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rubato = "0.15"
hound = "3.5"
nnnoiseless = "0.5"
thiserror = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
